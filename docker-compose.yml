services:
  api:
    image: ghcr.io/saleor/saleor:3.22
    ports:
      - 8000:8000
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    stdin_open: true
    tty: true
    depends_on:
      redis:
        condition: service_started
      jaeger:
        condition: service_started
      db:
        condition: service_healthy 
    volumes:
      # shared volume between worker and api for media
      - saleor-media:/app/media
    env_file:
      - common.env
      - backend.env
    environment:
      DASHBOARD_URL: ${DASHBOARD_URL}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      PUBLIC_URL: ${PUBLIC_URL}
    healthcheck:
      test: 
        - "CMD-SHELL"
        - "-c"
        - "python"
        - "import http.client; conn = http.client.HTTPConnection('localhost', 8000); try: conn.request('GET', '/graphql/'); res = conn.getresponse(); exit(0) if res.status == 200 else exit(1); except: exit(1)"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s # Give the service some time to start up before checking





  storefront:
    profiles: 
      - dev
    build:
      context: ./storefront
      dockerfile: Dockerfile
    volumes:
      # 1. Bind mount your application code
      # This keeps your code in sync with your host for development
      - ./storefront:/app
      # 2. Named volume for node_modules
      - node_modules_store:/app/node_modules  
      - next_compile_folder:/app/.next
    image: storefront_img
    container_name: storefront
    networks:
      - saleor-backend-tier
    ports: 
      - "3009:3000"
    depends_on:
      api: 
        condition: service_healthy 
    environment:
      NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL}
      NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL}
      SALEOR_APP_TOKEN: ${SALEOR_APP_TOKEN}
      
  storefront_prod:
    build:
      context: ./storefront
      dockerfile: Dockerfile
      target: runner       # use the production "runner" stage
      args:
        NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL}
    image: storefront_img_prod
    container_name: storefront_prod
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    ports:
      - "3000:3000"        # maps container 3000 -> host 3001 to avoid conflicts with dev
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL}
      NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL}
      SALEOR_APP_TOKEN: ${SALEOR_APP_TOKEN}
    # NOTE: do NOT mount ./storefront here — that would override the built standalone output
    # volumes: []

  dashboard:
    image: ghcr.io/saleor/saleor-dashboard:3.22
    ports:
      - 9000:80
    restart: unless-stopped
    environment:
      API_URL: ${API_URL}

  db:
    image: library/postgres:alpine
    ports:
      - 5432:5432
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - saleor-db:/var/lib/postgresql
      - ./replica_user.sql:/docker-entrypoint-initdb.d/replica_user.sql:ro,z
    secrets:
      - postgres_password
    environment:
      POSTGRES_USER: ${POSTGRES_USER}      
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: library/redis:alpine
    ports:
      - 6379:6379
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - saleor-redis:/data


#Scheduler:  https://docs.saleor.io/developer/running-saleor/task-queue
#command: celery -A saleor -B
  worker:
    image: ghcr.io/saleor/saleor:3.22
    command: celery --app=saleor.celeryconf:app worker --beat --scheduler=saleor.schedulers.schedulers.DatabaseScheduler -E --loglevel=info 
    # command: celery --app=saleor.celeryconf:app worker  -E --loglevel=info 
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    env_file:
      - common.env
      - backend.env
    depends_on:
      - redis
      - mailpit
    volumes:
      # shared volume between worker and api for media
      - saleor-media:/app/media
      
  flower:
    image: mher/flower:latest
    profiles: 
      - dev 
    depends_on: 
      - redis 
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - FLOWER_UNAUTHENTICATED_API=true
    networks: 
      - saleor-backend-tier
    ports: 
      - "5555:5555"



#Tracer 
  jaeger:
    image: jaegertracing/jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - type: tmpfs
        target: /tmp

#Mail config
  mailpit:
    image: axllent/mailpit
    ports:
      - 1025:1025 # smtp server
      - 8025:8025 # web ui. Visit http://localhost:8025/ to check emails
    restart: unless-stopped
    networks:
      - saleor-backend-tier

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy 
    secrets:
      - pgadmin_default_password
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_default_password
    volumes:
      - pgadmin-data:/var/lib/pgadmin 
      - ./servers.json:/pgadmin4/servers.json

volumes:
  saleor-db:
    driver: local
  saleor-redis:
    driver: local
  saleor-media:
  node_modules_store:
  next_compile_folder:
  pgadmin-data:

networks:
  saleor-backend-tier:
    driver: bridge

secrets:
  pgadmin_default_password:
    file: secrets/pgadmin_default_password.txt
  postgres_password:
    file: secrets/postgres_password.txt
